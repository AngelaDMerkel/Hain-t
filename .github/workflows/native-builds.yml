name: Native builds

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Select release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Select next semantic version
        run: python release_tools/next_version.py

  macos:
    name: macOS (${{ matrix.architecture }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build application bundle
        run: bash packaging/build_macos.sh
      - name: Smoke test packaged executable
        run: DATABASE_PATH="$RUNNER_TEMP/haint-check.sqlite3" dist/Haint.app/Contents/MacOS/Haint --check
      - name: Smoke test packaged TUI
        run: DATABASE_PATH="$RUNNER_TEMP/haint-tui-check.sqlite3" dist/haint-tui --check
      - name: Create archive
        run: |
          package="Haint-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.architecture }}"
          mkdir "$package"
          cp -R dist/Haint.app "$package/"
          cp dist/haint-tui LICENSE THIRD_PARTY_NOTICES.md "$package/"
          ditto -c -k --sequesterRsrc --keepParent "$package" "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Haint-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.architecture }}
          path: Haint-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.architecture }}.zip

  windows:
    name: Windows (x86_64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:DATABASE_PATH = "$env:RUNNER_TEMP\haint-check.sqlite3"
          & .\dist\Haint.exe --check
      - name: Smoke test packaged TUI
        shell: pwsh
        run: |
          $env:DATABASE_PATH = "$env:RUNNER_TEMP\haint-tui-check.sqlite3"
          & .\dist\haint-tui.exe --check
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\Haint.exe, .\dist\haint-tui.exe, .\LICENSE, .\THIRD_PARTY_NOTICES.md -DestinationPath .\Haint-${{ needs.prepare.outputs.version }}-Windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Haint-${{ needs.prepare.outputs.version }}-Windows-x86_64
          path: Haint-${{ needs.prepare.outputs.version }}-Windows-x86_64.zip

  debian:
    name: Debian package (amd64)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-tk python3-venv
      - name: Create build environment
        run: |
          python3 -m venv .build-venv
          echo "$GITHUB_WORKSPACE/.build-venv/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: .build-venv/bin/python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Debian package
        run: bash packaging/build_deb.sh "${{ needs.prepare.outputs.version }}"
      - name: Smoke test packaged executable
        run: DATABASE_PATH="$RUNNER_TEMP/haint-check.sqlite3" dist/haint --check
      - name: Smoke test packaged TUI
        run: DATABASE_PATH="$RUNNER_TEMP/haint-tui-check.sqlite3" dist/haint-tui --check
      - name: Inspect package metadata
        run: dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Haint-${{ needs.prepare.outputs.version }}-Debian-amd64
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - macos
      - windows
      - debian
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: Haint-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Hain’t $RELEASE_TAG"
          fi
